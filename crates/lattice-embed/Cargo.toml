[package]
name = "lattice-embed"
version = "0.0.1"
edition = "2021"

[dependencies]
tracing = { workspace = true }
servo = { version = "=0.1.4", optional = true }

[dev-dependencies]
url = "2"
image = { version = "0.25", features = ["png"] }
dpi = "0.1"
webrender_api = "0.68"
rustls = { version = "0.23", features = ["ring"] }

[features]
default = []
servo-embed = ["servo"]
