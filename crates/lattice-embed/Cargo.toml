[package]
name = "lattice-embed"
version = "0.0.1"
edition = "2021"

[dependencies]
tracing = { workspace = true }
servo = { version = "=0.1.4", optional = true }
url = { version = "2", optional = true }
image = { version = "0.25", features = ["png"], optional = true }
dpi = { version = "0.1", optional = true }
webrender_api = { version = "0.68", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }

[features]
default = []
servo-embed = [
    "dep:servo",
    "dep:url",
    "dep:image",
    "dep:dpi",
    "dep:webrender_api",
    "dep:rustls",
]
