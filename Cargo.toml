[workspace]
resolver = "2"
members = ["crates/lattice-core", "crates/lattice-embed", "crates/lattice-shell"]

[workspace.dependencies]
gpui = "0.2.2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# M0: xattr 0.2.3 (via zed-async-tar) references libc::ENOATTR removed in newer libc.
# Linux ENOATTR == ENODATA (61). Local vendor fix, remove after gpui_http_client updates.
xattr = { path = "patches/xattr" }
